<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#5E3EDF;--o:#FF5E36;--b:#220F06;--c:#FAF5EB}
*{box-sizing:border-box;margin:0}body{background:var(--c);color:var(--b);font-family:'Nunito Sans',sans-serif;overflow-x:hidden}
.bar{background:var(--b);color:var(--c);text-align:center;font-size:14px;font-weight:700;padding:9px}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 40px}
nav img{height:50px}nav ul{display:flex;gap:30px;list-style:none;padding:0;font-weight:800;font-size:15px}
.icons{display:flex;gap:18px;align-items:center}.dot{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px}.dot.c{background:var(--o);color:#fff;font-weight:800}
.hero{position:relative;margin:6px 24px 0;height:calc(100vh - 124px);min-height:620px;max-height:820px;border-radius:40px;overflow:hidden;background:#d9c7ae}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 40%}
.card{position:absolute;left:44px;bottom:44px;width:min(560px,48%);background:var(--c);border-radius:32px;padding:38px 40px 36px;box-shadow:0 12px 32px rgba(34,15,6,.14)}
.card h1{font-family:Fredoka;font-weight:700;line-height:.95;font-size:clamp(46px,5.2vw,78px);letter-spacing:-.01em;color:var(--p)}
.card h1 span{display:block;color:var(--o)}
.card p{font-size:19px;font-weight:600;line-height:1.4;margin:16px 0 22px}
.btn{display:inline-block;padding:15px 26px;border-radius:999px;font-weight:800;font-size:16px;margin-right:8px}.b1{background:var(--p);color:#fff}.b2{background:#fff;color:var(--p)}
.note{position:absolute;right:20px;top:14px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
@media(max-width:760px){nav{padding:12px 16px}nav ul{display:none}nav img{height:38px}.dot{width:36px;height:36px}.hero{margin:0 10px;height:690px;min-height:0;border-radius:30px}.hero>img{height:66%;object-position:62% 30%}.card{left:0;right:0;bottom:0;width:auto;border-radius:30px;padding:24px 22px}.card h1{font-size:11.5vw}.card p{font-size:16px;margin:10px 0 14px}.b2{display:none}}
</style></head><body>
<div class="bar">Tout pour vos animaux, à petits prix</div>
<nav><img src="../../public/images/brand/logo.svg" alt="MochiPaw"><ul><li>Accueil</li><li>Boutique</li><li>Chats</li><li>Chiens</li><li>Accessoires</li><li>Offres</li></ul><div class="icons"><span class="dot">⌕</span><span class="dot">♡</span><span class="dot c">0</span></div></nav>
<section class="hero"><img src="sunny-home-hero.png" alt=""><div class="card"><h1>GRAND AMOUR.<span>PETITS PRIX.</span></h1><p>Tout ce qu'il faut pour vos boules de poils, à des prix qui font plaisir.</p><span class="btn b1">Découvrir la boutique</span><span class="btn b2">Voir les offres</span></div><span class="note">Image illustrative</span></section>
</body></html>
